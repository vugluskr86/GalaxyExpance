<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Cosmos</title>
  <script type="module" crossorigin src="/GalaxyExpance/assets/game-TKafxQLJ.js"></script>
  <link rel="modulepreload" crossorigin href="/GalaxyExpance/assets/modulepreload-polyfill-Dezn_h7o.js">
  <link rel="modulepreload" crossorigin href="/GalaxyExpance/assets/landing-view-renderer.generated-Brb_iQtZ.js">
  <link rel="modulepreload" crossorigin href="/GalaxyExpance/assets/ship-render-CWW2clyP.js">
  <link rel="stylesheet" crossorigin href="/GalaxyExpance/assets/game-Zhs0UxSA.css">
</head>
<body>
<h1>Pixel Cosmos</h1>
<div class="layout">
  <div class="screens">
    <div class="stage">
      <canvas id="scene"></canvas>
      <canvas id="labels"></canvas>
      <div class="nameplate"><span id="npTitle">—</span><small id="npInfo">—</small><small id="npPerf" style="color:#7ee0ff;font-size:9px;display:block"></small></div>
      <div id="gameToast" class="game-toast hidden" role="status" aria-live="polite"></div>
      <button id="btnBack" class="stagebtn hidden" data-i18n="ui.back">← назад</button>
      <button id="btnZin" class="stagebtn">+</button>
      <button id="btnFit" class="stagebtn" data-i18n="ui.overview">Обзор</button>
      <button id="btnZout" class="stagebtn">−</button>
    </div>
    <div class="terminal-frame">
      <div class="terminal-title" data-i18n="ui.terminalHint">Бортовой терминал · кликните для ввода</div>
      <div class="terminal-screen">
        <canvas id="computerTerminal" width="560" height="560" tabindex="0"></canvas>
      </div>
    </div>
  </div>
  <div class="panel" id="panel"></div>
</div>
<div class="sub" data-i18n="ui.worldDescription">кластер галактик → галактика → система → тело · всё из одного зерна</div>
<div id="bootSplash" class="boot-splash" role="button" tabindex="0" aria-live="polite">
  <div class="boot-splash-box">
    <div class="boot-splash-title">PIXEL COSMOS</div>
    <div class="boot-splash-mark" aria-hidden="true">✦</div>
    <div class="boot-splash-prompt" data-i18n="ui.bootContinue">Нажмите для продолжения</div>
  </div>
</div>
</body>
</html>
